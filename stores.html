    <script>
      (function () {
        if (!location.hash) {
          history.replaceState(null, "", location.pathname + location.search + "#stores");
        }

        var BLOCK = /graffiti3-|\/videos\//;
        var TARGET = { img: 1, source: 1, video: 1 };
        var create = document.createElement;

        document.createElement = function (tag, options) {
          var node = create.call(document, tag, options);
          if (TARGET[String(tag).toLowerCase()]) {
            var setAttribute = node.setAttribute;
            node.setAttribute = function (name, value) {
              var attr = String(name).toLowerCase();
              if ((attr === "src" || attr === "srcset") && BLOCK.test(String(value))) return;
              return setAttribute.call(node, name, value);
            };

            ["src", "srcset"].forEach(function (prop) {
              var proto = Object.getPrototypeOf(node);
              var desc = proto && Object.getOwnPropertyDescriptor(proto, prop);
              if (!desc || !desc.set) return;
              Object.defineProperty(node, prop, {
                configurable: true,
                enumerable: desc.enumerable,
                get: function () { return desc.get.call(node); },
                set: function (value) {
                  if (BLOCK.test(String(value))) return;
                  desc.set.call(node, value);
                }
              });
            });
          }
          return node;
        };
      })();
    </script>
