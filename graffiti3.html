    <style>
      html.bbm-locked, html.bbm-locked body { overflow: hidden !important; }

      #bbm-age-gate {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #000000a6;
        -webkit-backdrop-filter: blur(18px) saturate(115%);
        backdrop-filter: blur(18px) saturate(115%);
        font-family: 'SF Pro KR', 'SF Pro Display', 'Apple SD Gothic Neo', Pretendard,
                     'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        animation: bbm-gate-in .28s ease-out both;
      }
      #bbm-age-gate[hidden] { display: none !important; }

      .bbm-gate-card {
        width: min(92vw, 400px);
        box-sizing: border-box;
        padding: 34px 28px 26px;
        border-radius: 20px;
        background: #141416;
        border: 1px solid #ffffff1f;
        box-shadow: 0 24px 64px #000000a6;
        text-align: center;
        animation: bbm-card-in .32s cubic-bezier(.2, .7, .3, 1) both;
      }
      .bbm-gate-card img { width: 92px; height: auto; opacity: .92; margin-bottom: 22px; }
      .bbm-gate-card h2 {
        margin: 0 0 10px;
        font-size: 19px;
        font-weight: 700;
        color: #f5f5f7;
        letter-spacing: -.01em;
      }
      .bbm-gate-card p {
        margin: 0 0 24px;
        font-size: 13px;
        line-height: 1.7;
        color: #86868b;
      }
      .bbm-gate-confirm {
        display: block;
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 999px;
        background: #caa263;
        color: #141414;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: filter .15s ease, transform .15s ease;
      }
      .bbm-gate-confirm:hover { filter: brightness(1.07); }
      .bbm-gate-confirm:active { transform: scale(.985); }
      .bbm-gate-confirm:focus-visible { outline: 2px solid #f5f5f7; outline-offset: 3px; }

      .bbm-gate-deny {
        display: inline-block;
        margin-top: 16px;
        padding: 4px 8px;
        background: none;
        border: 0;
        font: inherit;
        font-size: 12.5px;
        color: #ffffff6b;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      .bbm-gate-deny:hover { color: #a1a1a6; }

      .bbm-gate-note {
        margin: 20px 0 0;
        font-size: 11.5px;
        line-height: 1.6;
        color: #ffffff47;
      }

      @keyframes bbm-gate-in { from { opacity: 0 } to { opacity: 1 } }
      @keyframes bbm-card-in { from { opacity: 0; transform: translateY(14px) scale(.97) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) {
        #bbm-age-gate, .bbm-gate-card { animation: none; }
      }
    </style>

  <body>
    <div id="bbm-age-gate" role="dialog" aria-modal="true" aria-labelledby="bbm-gate-title">
      <div class="bbm-gate-card">
        <img src="/products/wevape-logo.webp" alt="버블몬 위베이프" />

        <div id="bbm-gate-ask">
          <h2 id="bbm-gate-title">성인 인증</h2>
          <p>
            이 사이트에서 소개하는 제품은<br />
            만 19세 이상 성인만 이용할 수 있습니다.
          </p>
          <button type="button" class="bbm-gate-confirm" id="bbm-gate-yes">만 19세 이상입니다</button>
          <button type="button" class="bbm-gate-deny" id="bbm-gate-no">만 19세 미만입니다</button>
          <p class="bbm-gate-note">청소년보호법에 따라 청소년의 접근이 제한됩니다.</p>
        </div>

        <div id="bbm-gate-block" hidden>
          <h2>이용할 수 없습니다</h2>
          <p>
            만 19세 미만 청소년은<br />
            이 사이트를 이용할 수 없습니다.
          </p>
          <p class="bbm-gate-note">청소년보호법 제19조</p>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var html = document.documentElement;
        var gate = document.getElementById('bbm-age-gate');

        function unlock() {
          gate.hidden = true;
          html.classList.remove('bbm-locked');
        }

        html.classList.add('bbm-locked');

        document.getElementById('bbm-gate-yes').addEventListener('click', function () {
          if (typeof gtag === 'function') gtag('event', 'age_verified');
          unlock();
        });

        document.getElementById('bbm-gate-no').addEventListener('click', function () {
          document.getElementById('bbm-gate-ask').hidden = true;
          document.getElementById('bbm-gate-block').hidden = false;
        });

        document.addEventListener('focusin', function (event) {
          if (!gate.hidden && !gate.contains(event.target)) {
            var button = document.getElementById('bbm-gate-yes');
            if (button && !button.closest('[hidden]')) button.focus();
          }
        });

        window.addEventListener('DOMContentLoaded', function () {
          var button = document.getElementById('bbm-gate-yes');
          if (button && !gate.hidden) button.focus();
        });
      })();
    </script>
